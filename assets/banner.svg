<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">.github</title>
  <desc id="d">The organisation's profile, its welcome deck, and the defaults every repository shares. The picture: 3 numbered stops on a line that climbs, each arriving in turn. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121f45"/><stop offset="1" stop-color="#0d152a"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#2252d9"/><stop offset="0.50" stop-color="#2966eb"/><stop offset="1.00" stop-color="#8baff5"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#2966eb" stop-opacity="0"/><stop offset=".35" stop-color="#2966eb"/><stop offset="1" stop-color="#8baff5"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <g stroke="#172d66" stroke-width="1" opacity=".5">
    <path d="M668 28V222"/>
    <path d="M738 28V222"/>
    <path d="M809 28V222"/>
    <path d="M879 28V222"/>
    <path d="M949 28V222"/>
    <path d="M1019 28V222"/>
    <path d="M1090 28V222"/>
    <path d="M1160 28V222"/>
    <path d="M668 28H1160"/>
    <path d="M668 93H1160"/>
    <path d="M668 157H1160"/>
    <path d="M668 222H1160"/>
    </g>
    <path class="draw" pathLength="100" d="M692.0 198.0 L914.0 129.4 L1136.0 56.0" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.30s"/>
    <circle class="halo" cx="1136.0" cy="56.0" r="13" fill="none" stroke="#8baff5" stroke-width="2"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <g class="arrive" style="animation-delay:0.40s"><circle cx="692.0" cy="198.0" r="13" fill="#0d152a" stroke="#2966eb" stroke-width="2.5"/><text x="692.0" y="202.5" fill="#8baff5">1</text></g>
    <g class="arrive" style="animation-delay:1.80s"><circle cx="914.0" cy="129.4" r="13" fill="#0d152a" stroke="#2966eb" stroke-width="2.5"/><text x="914.0" y="133.9" fill="#8baff5">2</text></g>
    <g class="arrive" style="animation-delay:3.20s"><circle cx="1136.0" cy="56.0" r="13" fill="#0d152a" stroke="#2966eb" stroke-width="2.5"/><text x="1136.0" y="60.5" fill="#8baff5">3</text></g>
    </g>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#1e3a8a"/><rect x="300.0" y="248" width="300.5" height="12" fill="#1d4ed8"/><rect x="600.0" y="248" width="300.5" height="12" fill="#2563eb"/><rect x="900.0" y="248" width="300.5" height="12" fill="#dbeafe"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="56.6" fill="#5585ef" font-size="15" font-weight="700" letter-spacing=".6">Psanctuary Church</text><text x="56" y="122.2" fill="#dbeafe" font-size="60" font-weight="700" letter-spacing="-.5">.github</text><text x="56" y="166.0" fill="#bfcee4" font-size="23">The organisation's profile, its welcome deck, and</text><text x="56" y="196.8" fill="#bfcee4" font-size="23">the defaults every repository shares.</text></g>
  </g>
</svg>
